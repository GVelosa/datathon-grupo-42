version: "3.9"

services:
  # ── vLLM — LLM local com quantização (Etapa 2) ───────────────────────────────
  # Requer GPU NVIDIA. Ative com: docker compose --profile gpu up
  # Troca entre quantizações via VLLM_QUANTIZATION=awq|int8|fp16
  vllm:
    build:
      context: .
      dockerfile: src/serving/Dockerfile.vllm
    profiles:
      - gpu
    ports:
      - "${VLLM_PORT:-8080}:${VLLM_PORT:-8080}"
    environment:
      - VLLM_MODEL=${VLLM_MODEL:-meta-llama/Meta-Llama-3.1-8B-Instruct}
      - VLLM_QUANTIZATION=${VLLM_QUANTIZATION:-awq}
      - VLLM_PORT=${VLLM_PORT:-8080}
      - VLLM_MAX_MODEL_LEN=${VLLM_MAX_MODEL_LEN:-4096}
      - VLLM_GPU_MEM_UTIL=${VLLM_GPU_MEM_UTIL:-0.90}
      - VLLM_DTYPE=${VLLM_DTYPE:-auto}
      - VLLM_TENSOR_PARALLEL=${VLLM_TENSOR_PARALLEL:-1}
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ipc: host
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${VLLM_PORT:-8080}/health"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 120s

  # ── API de Fraude + Agente ReAct ─────────────────────────────────────────────
  fraud-api:
    build:
      context: .
      dockerfile: src/serving/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Provider LLM: 'anthropic' (padrão) ou 'vllm' (local com GPU)
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AGENT_MODEL=${AGENT_MODEL:-claude-haiku-4-5-20251001}
      # vLLM (usado quando LLM_PROVIDER=vllm)
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://vllm:8080/v1}
      - VLLM_MODEL=${VLLM_MODEL:-meta-llama/Meta-Llama-3.1-8B-Instruct}
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      - PROMETHEUS_PORT=9090
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./configs:/app/configs:ro
      - ./docs:/app/docs:ro
      - mlflow_data:/app/mlruns
    depends_on:
      - mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── MLflow Tracking Server ────────────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.11.1
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow

  # ── Prometheus ────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"

  # ── Grafana ───────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=datathon42
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  mlflow_data:
  prometheus_data:
  grafana_data:
  hf_cache:       # Cache de modelos HuggingFace (persiste entre restarts)
