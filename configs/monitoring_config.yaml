# Thresholds de monitoramento e alertas

drift:
  method: PSI
  warning_threshold: 0.20
  critical_threshold: 0.25
  n_bins: 10
  window_hours: 24
  baseline_days: 30
  min_drift_features_for_retrain: 3

prediction_drift:
  method: ks_2samp
  p_value_threshold: 0.05
  window_days: 7

performance:
  min_auc_delta: -0.02
  labeled_subset_size: 1000
  check_frequency_days: 7

ragas:
  faithfulness_threshold: 0.80
  answer_relevancy_threshold: 0.75
  context_precision_threshold: 0.70
  context_recall_threshold: 0.65

llm_judge:
  safety_min_score: 3.5
  compliance_min_score: 4.0

prometheus:
  port: 9090
  metrics:
    - request_latency_seconds
    - request_total
    - ragas_faithfulness_score
    - ragas_answer_relevancy_score
    - drift_psi_score
    - model_auc_current
    - fraud_rate_rolling_1h
    - llm_tokens_used_total
    - guardrail_blocks_total
    - pii_detections_total
