# Configuração de monitoramento e alertas — Datathon Grupo 42

# ── Drift Detection ────────────────────────────────────────────────────────────
drift:
  method: PSI                   # Population Stability Index
  warning_threshold: 0.20       # PSI > 0.20 = WARNING
  critical_threshold: 0.25      # PSI > 0.25 = CRITICAL (dispara retreinamento)
  n_bins: 10
  window_hours: 24              # Janela rolling vs. baseline de treino
  baseline_days: 30
  min_drift_features_for_retrain: 3   # Nº de features em CRITICAL para acionar retrain
  features_monitored:
    - Amount
    - hour_of_day
    - V1
    - V2
    - V3
    - V4
    - V5
    - V6
    - V7
    - V8
    - V9
    - V10

# ── Prediction Drift ───────────────────────────────────────────────────────────
prediction_drift:
  method: ks_2samp              # Kolmogorov-Smirnov test
  p_value_threshold: 0.05       # p < 0.05 = ALERT
  window_days: 7

# ── Model Performance ──────────────────────────────────────────────────────────
performance:
  min_auc_delta: -0.02          # delta_AUC < -0.02 = dispara retreinamento
  min_auc_absolute: 0.92        # AUC < 0.92 = CRITICAL independente do delta
  labeled_subset_size: 1000
  check_frequency_days: 7

# ── RAGAS Quality Gates ────────────────────────────────────────────────────────
ragas:
  faithfulness_threshold: 0.80
  answer_relevancy_threshold: 0.75
  context_precision_threshold: 0.70
  context_recall_threshold: 0.65
  evaluation_frequency: on_deploy   # on_deploy | daily | weekly

# ── LLM Judge Gates ────────────────────────────────────────────────────────────
llm_judge:
  safety_min_score: 4.0         # safety < 4.0 = bloqueio de deploy
  compliance_min_score: 4.0     # compliance < 4.0 = revisão obrigatória
  overall_min_score: 3.5        # overall < 3.5 = falha no quality gate
  model: claude-haiku-4-5-20251001

# ── Prometheus ────────────────────────────────────────────────────────────────
prometheus:
  port: 9090
  scrape_interval_seconds: 15
  metrics:
    - name: request_latency_seconds
      type: histogram
      labels: [endpoint, method]
      buckets: [0.01, 0.05, 0.1, 0.25, 0.5, 1.0, 2.5, 5.0]
    - name: request_total
      type: counter
      labels: [endpoint, status_code]
    - name: ragas_faithfulness_score
      type: gauge
    - name: ragas_answer_relevancy_score
      type: gauge
    - name: drift_psi_score
      type: gauge
      labels: [feature]
    - name: model_auc_current
      type: gauge
    - name: fraud_rate_rolling_1h
      type: gauge
    - name: llm_tokens_used_total
      type: counter
      labels: [model, direction]
    - name: guardrail_blocks_total
      type: counter
      labels: [category]
    - name: pii_detections_total
      type: counter
      labels: [pii_type]

# ── Alert Rules ────────────────────────────────────────────────────────────────
alert_rules:
  - name: ModelAUCLow
    condition: model_auc_current < 0.92
    severity: CRITICAL
    message: "AUC do modelo abaixo de 0.92 — retreinamento necessário"
    action: trigger_retrain

  - name: DriftCritical
    condition: drift_psi_score > 0.25
    severity: CRITICAL
    message: "Drift crítico detectado em feature {feature} (PSI={value:.3f})"
    action: trigger_retrain

  - name: DriftWarning
    condition: drift_psi_score > 0.20
    severity: WARNING
    message: "Drift detectado em feature {feature} (PSI={value:.3f}) — monitorar"
    action: notify_team

  - name: RAGASFaithfulnessLow
    condition: ragas_faithfulness_score < 0.80
    severity: WARNING
    message: "RAGAS faithfulness abaixo do threshold (score={value:.3f})"
    action: notify_team

  - name: HighFraudRate
    condition: fraud_rate_rolling_1h > 0.005
    severity: WARNING
    message: "Taxa de fraude na última hora: {value:.4f} (acima do normal 0.0023)"
    action: notify_team

  - name: HighLatencyP95
    condition: request_latency_seconds_p95 > 3.0
    severity: WARNING
    message: "Latência P95 acima de 3s: {value:.2f}s"
    action: notify_sre

  - name: GuardrailSpike
    condition: rate(guardrail_blocks_total[5m]) > 10
    severity: WARNING
    message: "Spike de bloqueios de guardrail: {value:.0f}/min — possível ataque"
    action: notify_security

# ── Data Retention ─────────────────────────────────────────────────────────────
retention:
  raw_transactions_days: 1825   # 5 anos (BACEN 4.658)
  model_artifacts_days: 730     # 2 anos
  mlflow_runs_days: 365         # 1 ano
  prometheus_metrics_days: 30   # 30 dias (storage local)
  evaluation_reports_days: 365  # 1 ano
  audit_logs_days: 1825         # 5 anos (LGPD / BACEN)
