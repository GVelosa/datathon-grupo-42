[project]
name = "datathon-grupo-42"
version = "0.1.0"
description = "MLOps Modernization — Fraud Detection + Banking Health Agent (FIAP MLET Datathon Phase 5)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # ML
    "scikit-learn>=1.4.0",
    "torch>=2.2.0",
    "mlflow==3.11.1",
    "dvc>=3.50.0",
    "imbalanced-learn>=0.12.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "shap>=0.45.0",
    "numba>=0.60.0",
    "pyarrow>=15.0.0",
    # GenAI
    "anthropic>=0.28.0",
    "openai>=1.30.0",
    "sentence-transformers>=2.7.0",
    "faiss-cpu>=1.8.0",
    "pyyaml>=6.0.1",
    # Serving
    "python-dotenv>=1.0.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    # Monitoring
    "prometheus-client>=0.20.0",
    "langfuse>=2.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.12",
    "bandit>=1.7.8",
    "pre-commit>=3.7.0",
]
eval = [
    "ragas>=0.1.10",
    "datasets>=2.19.0",
    "langchain-anthropic>=0.3.0",
]
nlp = [
    "spacy>=3.7.0",
]
monitoring = [
    "evidently>=0.4.30",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "B", "C4"]
ignore = ["ANN401", "N803", "N806"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["ANN", "D", "S101", "N806"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_return_any = true
explicit_package_bases = true

[[tool.mypy.overrides]]
# sklearn/torch retornam Any nos stubs — falsos positivos de no-any-return
module = "src.models.baseline"
warn_return_any = false

[[tool.mypy.overrides]]
# Anthropic SDK usa tipos genéricos não compatíveis com TypedDict strict
module = "src.agent.react_agent"
disallow_any_generics = false
warn_return_any = false

[[tool.mypy.overrides]]
# PyYAML não tem stubs no __main__ block — apenas ignorar esse módulo
module = "src.models.train"
ignore_errors = false
warn_return_any = false

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=html --cov-report=term-missing --cov-fail-under=40"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.bandit]
skips = ["B101"]
targets = ["src"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
